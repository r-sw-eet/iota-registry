name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npm run lint
        working-directory: api
      - run: npm run typecheck
        working-directory: api
      - run: npm run test:cov
        working-directory: api
      - name: Enforce coverage baseline (no regression)
        run: npm run cov:check
        working-directory: api
      - name: Upload API coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./api/coverage/lcov.info
          flags: api
          token: ${{ secrets.CODECOV_TOKEN }}
          # Coverage upload is nice-to-have telemetry, not a merge gate.
          # Codecov's CDN has served mismatched binary/SHA256SUM pairs multiple
          # times this week, killing deploys with a SHASUM / GPG BAD-signature
          # error. The local `cov:check` step above is the real coverage
          # ratchet; Codecov is just for the web UI.
          fail_ci_if_error: false

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/website-v2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: projects/website-v2/package-lock.json
      - run: npm ci
      # `nuxi generate` reads NUXT_PUBLIC_API_BASE at build time and bakes it
      # into the static bundle. Setting it explicitly here means we never
      # accidentally ship a build that points at a developer's local API
      # (the dev `.env` does just that). The `build-blog-og.mjs` post-build
      # step also asserts no `localhost` URL leaked into the output.
      - name: Generate static site
        run: npm run generate
        env:
          NUXT_PUBLIC_API_BASE: https://iota-trade-scanner.net/api/v1
      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: website-v2-build
          path: projects/website-v2/.output/public
          retention-days: 7

  web-deploy:
    needs: [web-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Serialize web deploys so two fast-follow main pushes can't race on the
    # rsync. Independent of the api `deploy` group above — the static SPA
    # and the api container don't share files.
    concurrency:
      group: web-deploy-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: website-v2-build
          path: site
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST_WEB }} >> ~/.ssh/known_hosts
      - name: Rsync to web host
        run: |
          rsync -avz --no-perms --no-owner --no-group --delete-after \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes" \
            site/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST_WEB }}:/var/www/iota-registry.org/
      # Cheap post-deploy proof — verifies the live homepage is serving the
      # bundle we just shipped, and that no `localhost` URL slipped through.
      # This is the smoke test we paid for the hard way on 2026-05-06.
      - name: Smoke test live site
        run: |
          live_api=$(curl -fsS https://iota-registry.org/ | grep -o 'apiBase[^"]*"[^"]*' || true)
          echo "Live apiBase: $live_api"
          if [ -z "$live_api" ]; then
            echo "FAIL: couldn't read apiBase from live homepage"
            exit 1
          fi
          if echo "$live_api" | grep -q 'localhost'; then
            echo "FAIL: localhost apiBase made it to prod"
            exit 1
          fi
          api_health=$(curl -fsS -o /dev/null -w '%{http_code}' https://iota-trade-scanner.net/api/v1/health || true)
          echo "API /health: HTTP $api_health"
          if [ "$api_health" != "200" ]; then
            echo "FAIL: api health check failed"
            exit 1
          fi

  deploy:
    needs: [api-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Serialize deploys per host — parallel main pushes (or fast-follow
    # commits) can't race on the SSH deploy step. Pair with the flock inside
    # scripts/deploy.sh so direct invocations on the server are also safe.
    # The group must include the matrix host: one shared group holds a single
    # pending slot, so stacked runs starve out whichever leg queues second
    # (a 5-merge burst on 2026-07-02 cancelled every scanner deploy).
    concurrency:
      group: deploy-main-${{ matrix.host.name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    strategy:
      # Deploy to both hosts; the deploy script adapts based on the compose
      # services defined on each host (web → mongo+api, scanner → api only).
      # fail-fast: false so a flaky host doesn't skip the other.
      fail-fast: false
      matrix:
        host:
          - name: web
            secret: DEPLOY_HOST_WEB
          - name: scanner
            secret: DEPLOY_HOST_SCANNER
    steps:
      - uses: actions/checkout@v6
      - name: Resolve host for this matrix entry
        id: host
        run: |
          case "${{ matrix.host.name }}" in
            web) echo "addr=${{ secrets.DEPLOY_HOST_WEB }}" >> "$GITHUB_OUTPUT" ;;
            scanner) echo "addr=${{ secrets.DEPLOY_HOST_SCANNER }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ steps.host.outputs.addr }} >> ~/.ssh/known_hosts
      - name: Run deploy script on ${{ matrix.host.name }} (${{ steps.host.outputs.addr }})
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ steps.host.outputs.addr }} 'bash -s' < scripts/deploy.sh
